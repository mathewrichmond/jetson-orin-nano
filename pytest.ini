[pytest]
# Pytest Configuration

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 6.0

# Add options to command line
addopts =
    # Output options
    --strict-markers
    --tb=short
    --disable-warnings
    
    # Coverage options (when --cov is used)
    --cov-branch
    --cov-report=term-missing:skip-covered
    
    # Performance
    --maxfail=10

# Markers
markers =
    unit: Unit tests (hermetic, fast, no external dependencies)
    integration: Integration tests (require ROS 2, may be slow)
    hardware: Hardware tests (require real devices)
    slow: Slow tests (> 1 second)
    gpu: GPU tests (require CUDA)
    smoke: Smoke tests (quick sanity checks)

# Ignore patterns
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .venv
    venv
    install
    log

# Test timeout (per test)
timeout = 300
timeout_method = thread

# Environment variables for tests
env =
    ROS_DOMAIN_ID=42
    MOCK_HARDWARE=true
    PYTHONDONTWRITEBYTECODE=1

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
