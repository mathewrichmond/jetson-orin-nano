version: '3.8'

# Minimal Robot System for Bringup & Calibration
# Single service with all essential components

services:
  # ============================================================================
  # Robot Control Service
  # ============================================================================
  # - Chassis control
  # - Camera pipeline
  # - SLAM (ground truth poses)
  # - Odometry estimation & calibration
  # - Sensor fusion
  robot-control:
    build:
      context: .
      dockerfile: docker/Dockerfile.robot-control
    image: isaac-robot-control:latest
    container_name: isaac-robot-control
    restart: unless-stopped
    network_mode: host  # ROS 2 DDS discovery
    runtime: nvidia     # GPU for SLAM
    privileged: true    # Device access
    
    volumes:
      # Config (calibration data - READ/WRITE for calibration updates)
      - /data/config:/data/config
      
      # Logs
      - /data/logs/robot-control:/data/logs
      
      # Sessions (calibration raw data, recordings)
      - /data/sessions:/data/sessions
      
      # Worldgraph (persistent TSDF maps)
      - /data/worldgraph:/data/worldgraph
      
      # Device access
      - /dev:/dev
    
    environment:
      - ROS_DOMAIN_ID=0
      - LOG_LEVEL=INFO
      - ROBOT_MODE=calibration  # or 'normal'
    
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 4G
    
    healthcheck:
      test: ["CMD", "ros2", "node", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

# ============================================================================
# Calibration Flow
# ============================================================================
# 1. Start in calibration mode: ROBOT_MODE=calibration
# 2. Drive robot manually while SLAM runs
# 3. SLAM produces ground truth camera poses
# 4. Record: camera poses (SLAM) + wheel odometry data
# 5. Offline: Calibrate odometry model against SLAM poses
# 6. Save: Calibrated odometry params to /data/config/odometry_calibration.yaml
# 7. Normal mode: Use calibrated odometry + SLAM for localization
