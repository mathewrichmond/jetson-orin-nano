name: Deploy to Robot

on:
  # Manual deploy with environment + target selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - dev
          - production
      jetson_host:
        description: 'Jetson hostname or IP (e.g. isaac.local)'
        required: true
        default: 'isaac.local'

env:
  DEPLOY_USER: nano
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/isaac-robot-control

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Build ARM64 image on the self-hosted GPU machine and push to ghcr.io
  # ──────────────────────────────────────────────────────────────────────────
  build-arm64:
    name: Build ARM64 Image
    runs-on: [self-hosted, linux, gpu]

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker buildx
        run: |
          docker buildx use robotics-builder 2>/dev/null || \
            docker buildx create --name robotics-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.robot-control
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # Deploy: SSH to Jetson, pull image, restart services
  # ──────────────────────────────────────────────────────────────────────────
  deploy-jetson:
    name: Deploy to Jetson
    runs-on: [self-hosted, linux, gpu]
    needs: build-arm64

    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.JETSON_SSH_KEY }}" > ~/.ssh/jetson_key
          chmod 600 ~/.ssh/jetson_key
          ssh-keyscan -H ${{ github.event.inputs.jetson_host }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/jetson_key -o ConnectTimeout=10 \
            ${{ env.DEPLOY_USER }}@${{ github.event.inputs.jetson_host }} \
            "echo 'SSH OK: $(hostname)'"

      - name: Sync compose file and config
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/jetson_key" \
            --include='docker-compose.yml' \
            --include='config/***' \
            --exclude='*' \
            ./ ${{ env.DEPLOY_USER }}@${{ github.event.inputs.jetson_host }}:~/src/jetson-orin-nano/

      - name: Pull image and restart
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
          ssh -i ~/.ssh/jetson_key \
            ${{ env.DEPLOY_USER }}@${{ github.event.inputs.jetson_host }} << EOF
            set -e
            echo "Pulling $IMAGE ..."
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null

            docker pull "$IMAGE"

            cd ~/src/jetson-orin-nano
            IMAGE="$IMAGE" docker compose up -d --remove-orphans

            echo "Waiting for health check..."
            sleep 5
            docker compose ps
          EOF

      - name: Health check
        run: |
          ssh -i ~/.ssh/jetson_key \
            ${{ env.DEPLOY_USER }}@${{ github.event.inputs.jetson_host }} \
            "docker inspect --format='{{.State.Health.Status}}' isaac-robot-control"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/jetson_key
