name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4

      - name: Build CI image
        run: docker build -f Dockerfile.ci -t isaac-robot-ci:${{ github.sha }} .

      - name: black
        run: |
          docker run --rm isaac-robot-ci:${{ github.sha }} \
            black --check --diff src/ tests/

      - name: isort
        run: |
          docker run --rm isaac-robot-ci:${{ github.sha }} \
            isort --check-only --diff src/ tests/

      - name: flake8
        run: |
          docker run --rm isaac-robot-ci:${{ github.sha }} \
            flake8 src/ tests/

  unit-tests:
    name: Unit Tests
    runs-on: [self-hosted, linux, gpu]
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build CI image
        run: docker build -f Dockerfile.ci -t isaac-robot-ci:${{ github.sha }} .

      - name: Run unit tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests:/workspace/tests:ro \
            isaac-robot-ci:${{ github.sha }} \
            pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests:/workspace/tests:ro \
            isaac-robot-ci:${{ github.sha }} \
            pytest tests/integration/ -v --tb=short

  cleanup:
    name: Cleanup
    runs-on: [self-hosted, linux, gpu]
    needs: [lint, unit-tests]
    if: always()
    steps:
      - name: Remove CI image
        run: docker rmi isaac-robot-ci:${{ github.sha }} || true
