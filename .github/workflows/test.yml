name: Test Suite

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  ROS_DISTRO: humble
  PYTHON_VERSION: "3.10"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term \
            --junit-xml=test-results/unit-tests.xml \
            -m "unit and not slow"
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-unit
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: unit-test-results
          path: test-results/
  
  integration-tests:
    name: Integration Tests (ROS 2)
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install ROS 2 Humble
        run: |
          sudo apt update
          sudo apt install -y software-properties-common
          sudo add-apt-repository universe
          sudo apt update && sudo apt install -y curl
          
          # Add ROS 2 apt repository
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          
          # Install ROS 2 Humble
          sudo apt update
          sudo apt install -y \
            ros-humble-ros-base \
            ros-humble-foxglove-bridge \
            python3-colcon-common-extensions \
            python3-rosdep
      
      - name: Install dependencies
        run: |
          # Install Python dependencies
          pip install -e ".[dev]"
          
          # Initialize rosdep
          sudo rosdep init || true
          rosdep update
      
      - name: Build ROS 2 packages
        run: |
          source /opt/ros/humble/setup.bash
          
          # Build packages
          colcon build \
            --packages-select custom_msgs chassis_control vision_pipeline power_management audio_pipeline vla_planner \
            --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
      
      - name: Run integration tests
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          
          # Set test environment
          export ROS_DOMAIN_ID=42
          export MOCK_HARDWARE=true
          
          # Run integration tests
          pytest tests/integration/ \
            -v \
            --junit-xml=test-results/integration-tests.xml \
            -m "integration and not slow and not hardware"
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results
          path: test-results/
  
  lint:
    name: Linting
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install linting tools
        run: |
          pip install black isort pylint flake8 mypy
      
      - name: Run black
        run: |
          black --check src/ tests/
      
      - name: Run isort
        run: |
          isort --check-only src/ tests/
      
      - name: Run flake8
        run: |
          flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503
      
      - name: Run pylint
        run: |
          pylint src/modules/*/*/**.py --rcfile=.pylintrc || true
  
  build-test:
    name: Build Test (All Packages)
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install ROS 2 Humble
        run: |
          sudo apt update
          sudo apt install -y software-properties-common curl
          
          # Add ROS 2 apt repository
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          
          sudo apt update
          sudo apt install -y \
            ros-humble-ros-base \
            python3-colcon-common-extensions \
            python3-rosdep
      
      - name: Build all packages
        run: |
          source /opt/ros/humble/setup.bash
          
          colcon build \
            --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
      
      - name: Test build artifacts
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          
          # Verify packages built
          ros2 pkg list | grep -E "(custom_msgs|chassis_control|vision_pipeline|power_management|audio_pipeline|vla_planner)"
