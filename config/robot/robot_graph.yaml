# Robot Graph Configuration
# Defines the complete robot system topology and node connections

robot:
  # System components
  system_monitor:
    enabled: true
    package: system_monitor
    node: system_monitor_node
    namespace: /system
    parameters:
      update_rate: 1.0
      temp_warning_threshold: 70.0
      temp_critical_threshold: 85.0
      cpu_warning_threshold: 80.0
      memory_warning_threshold: 85.0
      disk_warning_threshold: 85.0
    topics:
      publish:
        - /system/status
        - /system/temperature/cpu
        - /system/temperature/gpu
        - /system/cpu/usage
        - /system/gpu/usage
        - /system/memory/usage
        - /system/disk/usage
        - /system/power
        - /system/alerts
        - /system/camera/health
      subscribe:
        - /realsense/status

  # VLA Controller (placeholder for future)
  vla_controller:
    enabled: false
    package: vla_controller
    node: vla_controller_node
    namespace: /control
    parameters:
      model_path: ""
      update_rate: 10.0
    topics:
      publish:
        - /control/commands
        - /control/status
      subscribe:
        - /camera/image
        - /system/status

  # RealSense Cameras
  realsense_camera:
    enabled: true
    package: realsense_camera
    node: realsense_camera_node
    namespace: /hardware
    parameters:
      enable_color: true
      enable_depth: true
      enable_pointcloud: false  # Disabled - using nvblox downsampled point clouds instead
      color_width: 640
      color_height: 480
      color_fps: 15  # Reduced from 30 to improve bridge stability
      depth_width: 640
      depth_height: 480
      depth_fps: 15  # Reduced from 30 to improve bridge stability
      publish_rate: 15.0  # Reduced from 30.0 to improve bridge stability
    topics:
      publish:
        - /camera_front/color/image_raw
        - /camera_front/color/camera_info
        - /camera_front/depth/image_rect_raw
        - /camera_front/depth/camera_info
        - /camera_rear/color/image_raw
        - /camera_rear/color/camera_info
        - /camera_rear/depth/image_rect_raw
        - /camera_rear/depth/camera_info
        - /realsense/status
      subscribe: []

  # nvblox Processor (pre-processes RealSense data for efficient visualization and VLA features)
  nvblox_processor:
    enabled: true
    package: nvblox_processor
    node: nvblox_processor_node
    namespace: ""
    parameters:
      camera_names: ["camera_front", "camera_rear"]
      voxel_size: 0.05
      tsdf_truncation_distance: 0.1
      max_tsdf_weight: 100.0
      mesh_update_rate: 5.0
      pointcloud_downsample_factor: 8  # Increased from 4 to reduce point cloud size
      publish_tsdf_markers: false  # Disable large TSDF markers to reduce bridge load
      publish_mesh_markers: true  # Enable mesh markers (may be more efficient than point clouds)
      publish_downsampled_points: true  # Keep point clouds as fallback
      status_topic: "/nvblox/status"
      namespace: "/nvblox"
    topics:
      publish:
        - /nvblox/status
        - /nvblox/camera_front/points_downsampled
        - /nvblox/camera_rear/points_downsampled
        - /nvblox/camera_front/mesh  # Mesh markers (may be more efficient than point clouds)
        - /nvblox/camera_rear/mesh
        # TSDF markers disabled to reduce bridge load
        # - /nvblox/camera_front/tsdf
        # - /nvblox/camera_rear/tsdf
      subscribe:
        - /hardware/camera_front/depth/image_rect_raw
        - /hardware/camera_front/color/image_raw
        - /hardware/camera_front/depth/camera_info
        - /hardware/camera_rear/depth/image_rect_raw
        - /hardware/camera_rear/color/image_raw
        - /hardware/camera_rear/depth/camera_info

  # USB Microphone
  usb_microphone:
    enabled: true
    package: usb_microphone
    node: usb_microphone_node
    namespace: /hardware
    parameters:
      device: 'default'
      sample_rate: 16000
      channels: 2  # USB mic requires stereo (2 channels)
      format: 'S16_LE'
      chunk_size: 1024
      publish_rate: 10.0
      audio_topic: '/microphone/audio'
    topics:
      publish:
        - /microphone/status
        - /microphone/audio
      subscribe: []

  # ODrive Motor Controller
  odrive_controller:
    enabled: true
    package: odrive_controller
    node: odrive_controller_node
    namespace: /hardware
    parameters:
      serial_port: '/dev/ttyUSB0'
      baudrate: 115200
      timeout: 1.0
      use_can: false
      can_interface: 'can0'
      can_node_id: 0
      publish_rate: 50.0
      enable_accelerometer: true
    topics:
      publish:
        - /odrive/status
        - /odrive/imu
      subscribe:
        - /cmd_vel

  # iRobot Developer Kit Serial
  irobot_serial:
    enabled: true
    package: irobot_serial
    node: irobot_serial_node
    namespace: /hardware
    parameters:
      serial_port: '/dev/ttyUSB1'
      baudrate: 115200
      timeout: 1.0
      publish_rate: 10.0
      robot_type: 'create2'
    topics:
      publish:
        - /irobot/status
        - /irobot/battery
      subscribe:
        - /cmd_vel

  # PHAT Motor Controller (GPIO + Accelerometer)
  phat_motor_controller:
    enabled: true
    package: phat_motor_controller
    node: phat_motor_controller_node
    namespace: /hardware
    parameters:
      i2c_bus: 7  # Jetson Orin Nano uses bus 7 (Raspberry Pi uses bus 1)
      accelerometer_address: 0x69
      accelerometer_type: 'ICM20948'
      enable_accelerometer: true
      publish_rate: 50.0
      motor_left_pwm_pin: 18
      motor_left_dir_pin: 16
      motor_right_pwm_pin: 19
      motor_right_dir_pin: 20
      pwm_frequency: 1000
      pwm_initial_duty_cycle: 0.0
      wheelbase: 0.2
      max_speed: 1.0
      gpio_mode: 'BOARD'
      status_topic: '/phat/status'
      imu_topic: '/phat/imu'
      magnetometer_topic: '/phat/magnetometer'
      cmd_vel_topic: '/cmd_vel'
      imu_frame_id: 'phat_imu'
    topics:
      publish:
        - /phat/status
        - /phat/imu
        - /phat/magnetometer
      subscribe:
        - /cmd_vel

  # Foxglove Bridge (for remote visualization)
  # Note: Bridge subscribes to all topics by default, which can cause connection drops
  # with high-frequency camera topics. Consider reducing camera frame rates if experiencing
  # disconnects, or use topic filtering via bridge command-line arguments.
  foxglove_bridge:
    enabled: true
    package: foxglove_bridge
    node: foxglove_bridge
    namespace: ""
    parameters:
      port: 8765
      address: "0.0.0.0"
      # Topic whitelist to reduce bridge load - only forward essential topics
      topic_whitelist: '["/phat/imu", "/phat/status", "/system/.*", "/nvblox/.*/points_downsampled", "/hardware/.*/color/image_raw", "/hardware/.*/color/camera_info", "/microphone/audio"]'
    topics:
      publish: []  # Bridge publishes/subscribes to all topics automatically
      subscribe: []

  # Communication with sub-modules (placeholder)
  submodules:
    raspberry_pi:
      enabled: false
      namespace: /submodules/rpi
      topics:
        publish:
          - /submodules/rpi/status
        subscribe:
          - /submodules/rpi/commands

# Topic remappings
remappings:
  # Example remappings for different robot configurations
  # - from: /camera/image
  #   to: /front_camera/image

# Node groups
groups:
  core:
    - system_monitor

  control:
    - vla_controller

  hardware:
    - realsense_camera
    - nvblox_processor
    - usb_microphone
    - odrive_controller
    - irobot_serial
    - phat_motor_controller

  bench_test:
    - system_monitor
    - realsense_camera
    - nvblox_processor
    - usb_microphone
    - odrive_controller
    - irobot_serial
    - phat_motor_controller

  all:
    - system_monitor
    - realsense_camera
    - nvblox_processor
    - usb_microphone
    - odrive_controller
    - irobot_serial
    - phat_motor_controller
    - foxglove_bridge
