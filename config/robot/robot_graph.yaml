# Robot Graph Configuration
# Defines the complete robot system topology and node connections

robot:
  # System components
  system_monitor:
    enabled: true
    package: system_monitor
    node: system_monitor_node
    namespace: /system
    parameters:
      update_rate: 5.0  # Increased from 1.0 to reduce sparsity
      temp_warning_threshold: 70.0
      temp_critical_threshold: 85.0
      cpu_warning_threshold: 80.0
      memory_warning_threshold: 85.0
      disk_warning_threshold: 85.0
    topics:
      publish:
        - /system/status
        - /system/temperature/cpu
        - /system/temperature/gpu
        - /system/cpu/usage
        - /system/gpu/usage
        - /system/memory/usage
        - /system/disk/usage
        - /system/power
        - /system/alerts
        - /system/camera/health
      subscribe:
        - /realsense/status

  # VLA Controller (placeholder for future)
  vla_controller:
    enabled: false
    package: vla_controller
    node: vla_controller_node
    namespace: /control
    parameters:
      model_path: ""
      update_rate: 10.0
    topics:
      publish:
        - /control/commands
        - /control/status
      subscribe:
        - /camera/image
        - /system/status

  # RealSense Cameras
  realsense_camera:
    enabled: true
    package: realsense_camera
    node: realsense_camera_node
    namespace: /hardware
    parameters:
      enable_color: true
      enable_depth: true
      enable_pointcloud: false  # Disabled - using nvblox downsampled point clouds instead
      color_width: 640  # 320x240 @ 10 Hz is not supported on D435
      color_height: 480
      color_fps: 15
      depth_width: 640
      depth_height: 480
      depth_fps: 15
      publish_rate: 15.0
      enable_inter_cam_sync: true  # Enable firmware-based inter-camera sync (requires sync cables)
      inter_cam_sync_mode: 0  # 0=None, 1=Master, 2=Slave (auto-assigned: first=master, others=slaves)
      sync_status_interval_sec: 5.0
      sync_status_tolerance_ms: 5.0
    topics:
      publish:
        - /camera_front/color/image_raw
        - /camera_front/color/camera_info
        - /camera_front/depth/image_rect_raw
        - /camera_front/depth/camera_info
        - /camera_rear/color/image_raw
        - /camera_rear/color/camera_info
        - /camera_rear/depth/image_rect_raw
        - /camera_rear/depth/camera_info
        - /realsense/status
      subscribe: []

  # nvblox Processor (pre-processes RealSense data for efficient visualization and VLA features)
  nvblox_processor:
    enabled: true
    package: nvblox_processor
    node: nvblox_processor_node
    namespace: ""
    parameters:
      camera_names: ["camera_front", "camera_rear"]
      voxel_size: 0.05
      tsdf_truncation_distance: 0.1
      max_tsdf_weight: 100.0
      mesh_update_rate: 5.0
      # Full quality outputs (fusion node handles downsampling for consumers)
      pointcloud_downsample_factor: 1  # Full resolution (fusion node downsamples)
      publish_tsdf_markers: true  # Full TSDF (fusion node extracts/coarsens)
      publish_mesh_markers: true  # Full quality mesh (fusion node decimates)
      publish_downsampled_points: true  # Full pointclouds (fusion node downsamples)
      # Multi-camera fusion
      fuse_cameras: true  # Fuse front + rear into unified TSDF/mesh
      status_topic: "/nvblox/status"
      namespace: "/nvblox/full"  # Full quality namespace
    topics:
      publish:
        - /nvblox/status
        # Full quality outputs (fusion node will downsample for consumers)
        - /nvblox/full/camera_front/pointcloud  # Full resolution
        - /nvblox/full/camera_rear/pointcloud  # Full resolution
        - /nvblox/full/mesh  # Full quality fused mesh
        - /nvblox/full/tsdf  # Complete TSDF voxel grid
        - /nvblox/full/camera_front/image  # Full resolution images
        - /nvblox/full/camera_rear/image  # Full resolution images
      subscribe:
        - /hardware/camera_front/depth/image_rect_raw
        - /hardware/camera_front/color/image_raw
        - /hardware/camera_front/depth/camera_info
        - /hardware/camera_rear/depth/image_rect_raw
        - /hardware/camera_rear/color/image_raw
        - /hardware/camera_rear/depth/camera_info

  # USB Microphone
  usb_microphone:
    enabled: true
    package: usb_microphone
    node: usb_microphone_node
    namespace: /hardware
    parameters:
      device: 'default'
      sample_rate: 16000
      channels: 2  # USB mic requires stereo (2 channels)
      format: 'S16_LE'
      chunk_size: 1024
      publish_rate: 10.0
      audio_topic: '/microphone/audio'
    topics:
      publish:
        - /microphone/status
        - /microphone/audio
      subscribe: []

  # ODrive Motor Controller
  odrive_controller:
    enabled: false
    package: odrive_controller
    node: odrive_controller_node
    namespace: /hardware
    parameters:
      serial_port: '/dev/ttyUSB0'
      baudrate: 115200
      timeout: 1.0
      use_can: false
      can_interface: 'can0'
      can_node_id: 0
      publish_rate: 50.0
      enable_accelerometer: true
    topics:
      publish:
        - /odrive/status
        - /odrive/imu
      subscribe:
        - /cmd_vel

  # iRobot Developer Kit Serial
  irobot_serial:
    enabled: true
    package: irobot_serial
    node: irobot_serial_node
    namespace: /hardware
    parameters:
      serial_port: '/dev/ttyUSB0'
      baudrate: 115200
      timeout: 1.0
      publish_rate: 10.0
      robot_type: 'create2'
    topics:
      publish:
        - /irobot/status
        - /irobot/battery
      subscribe:
        - /cmd_vel

  # Hardware Sync Signal Generator (GPIO-based sync pulses for cameras)
  hardware_sync_generator:
    enabled: false  # Enable when hardware sync is connected
    package: sensor_sync
    node: hardware_sync_generator_node
    namespace: ""
    parameters:
      sync_gpio_pin: 21  # GPIO pin for sync signal (PHAT board, unused pin)
      sync_frequency: 15.0  # Match camera FPS
      pulse_width_ms: 1.0  # Pulse width in milliseconds
      gpio_mode: 'BOARD'  # GPIO numbering mode
      enable_sync: true
      status_topic: '/hardware_sync/status'
    topics:
      publish:
        - /hardware_sync/status
      subscribe: []

  # Sensor Fusion Node (synchronizes, filters, and fuses sensors)
  # Outputs: Feature topics (for VLM) and Visualization topics (for monitoring)
  sensor_fusion:
    enabled: true
    package: sensor_sync  # TODO: Rename package to sensor_fusion
    node: sensor_sync_node  # TODO: Rename node to sensor_fusion_node
    namespace: ""
    parameters:
      sync_to_camera: true
      sync_camera_frames: true  # Sync multiple cameras together (software sync)
      camera_frame_sync_tolerance: 0.05  # Max time diff between cameras (50ms)
      target_frequency: 15.0  # Match camera FPS for features
      imu_filter_enabled: true
      imu_process_noise: 0.01
      imu_measurement_noise: 0.1
      max_buffer_size: 100
      time_sync_tolerance: 0.1
      camera_topics:
        - "/hardware/camera_front/color/image_raw"
        - "/hardware/camera_rear/color/image_raw"
      imu_topic: "/phat/imu"
      battery_topic: "/irobot/battery"
      status_topic: "/irobot/status"
      output_namespace: "/sensor_fusion"
      publish_vlm_features: true
      # Visualization topics (downsampled for bridge)
      publish_viz_topics: true
      viz_frequency: 10.0  # Lower frequency for visualization
      viz_resolution_width: 320  # Lower resolution for bridge
      viz_resolution_height: 240
      # Feature topic downsampling (moderate)
      feature_image_width: 480  # Downsampled from 640
      feature_image_height: 360  # Downsampled from 480
      feature_pointcloud_factor: 2  # Every 2nd point
      feature_mesh_decimation: 0.5  # 50% triangle reduction
      feature_tsdf_voxel_size: 0.1  # Coarser voxels (from 0.05m)
      # Viz topic downsampling (aggressive)
      viz_pointcloud_factor: 16  # Every 16th point
      viz_mesh_decimation: 0.75  # 75% triangle reduction
      viz_tsdf_extract_mesh: true  # Extract mesh from TSDF instead of voxel grid
      viz_tsdf_fps: 2.0  # Lower frequency for TSDF mesh
      # System status integration
      enable_system_status: true  # Enable system status synchronization
    topics:
      publish:
        # Feature topics (for VLM/feature builder) - 15 Hz, moderate downsampling
        - /sensor_fusion/imu/filtered
        - /sensor_fusion/chassis/battery
        - /sensor_fusion/chassis/status
        - /sensor_fusion/vlm_features
        - /sensor_fusion/camera_front/color/image_raw  # 480×360, downsampled from 640×480
        - /sensor_fusion/camera_rear/color/image_raw  # 480×360, downsampled from 640×480
        # 3D data for features (moderate downsampling)
        - /sensor_fusion/three_d/camera_front/pointcloud  # Factor 2 downsampling
        - /sensor_fusion/three_d/camera_rear/pointcloud  # Factor 2 downsampling
        - /sensor_fusion/three_d/mesh  # 50% decimation, fused cameras
        - /sensor_fusion/three_d/tsdf  # Coarser voxel grid (0.1m)
        # System status topics (for controller) - Synchronized with sensor data
        - /sensor_fusion/system/status
        - /sensor_fusion/system/temperature/cpu
        - /sensor_fusion/system/temperature/gpu
        - /sensor_fusion/system/cpu/usage
        - /sensor_fusion/system/gpu/usage
        - /sensor_fusion/system/memory/usage
        - /sensor_fusion/system/disk/usage
        - /sensor_fusion/system/power
        - /sensor_fusion/system/alerts
        - /sensor_fusion/system/hardware/camera_sync_status
        # Visualization topics (for bridge) - Aggressive downsampling
        - /viz/remote/imu/filtered
        - /viz/remote/chassis/battery
        - /viz/remote/camera_front/color/image_raw  # 320×240 @ 10 Hz
        - /viz/remote/camera_rear/color/image_raw  # 320×240 @ 10 Hz
        # 3D data topics (aggressively downsampled)
        - /viz/remote/three_d/pointcloud  # Factor 16 downsampling @ 5 Hz
        - /viz/remote/three_d/mesh  # 75% decimation @ 5 Hz
        - /viz/remote/three_d/tsdf_mesh  # TSDF mesh extraction @ 2 Hz
        # System status for visualization (lower frequency)
        - /viz/remote/system/status
        - /viz/remote/system/temperature/cpu
        - /viz/remote/system/temperature/gpu
        - /viz/remote/system/cpu/usage
        - /viz/remote/system/memory/usage
        - /viz/remote/system/alerts
        - /sensor_fusion/status
      subscribe:
        - /phat/imu
        - /irobot/battery
        - /irobot/status
        - /hardware/camera_front/color/image_raw
        - /hardware/camera_rear/color/image_raw
        # System monitor topics
        - /system/status
        - /system/temperature/cpu
        - /system/temperature/gpu
        - /system/cpu/usage
        - /system/gpu/usage
        - /system/memory/usage
        - /system/disk/usage
        - /system/power
        - /system/alerts
        # Full quality 3D data from nvblox (for downsampling)
        - /nvblox/full/camera_front/pointcloud  # Full resolution pointclouds
        - /nvblox/full/camera_rear/pointcloud
        - /nvblox/full/mesh  # Full quality fused mesh
        - /nvblox/full/tsdf  # Complete TSDF voxel grid
        - /nvblox/full/camera_front/image  # Full resolution images
        - /nvblox/full/camera_rear/image

  # PHAT Motor Controller (GPIO + Accelerometer)
  phat_motor_controller:
    enabled: true
    package: phat_motor_controller
    node: phat_motor_controller_node
    namespace: /hardware
    parameters:
      i2c_bus: 7  # Jetson Orin Nano uses bus 7 (Raspberry Pi uses bus 1)
      accelerometer_address: 0x69
      accelerometer_type: 'ICM20948'
      enable_accelerometer: true
      publish_rate: 50.0
      motor_left_pwm_pin: 18
      motor_left_dir_pin: 16
      motor_right_pwm_pin: 19
      motor_right_dir_pin: 20
      pwm_frequency: 1000
      pwm_initial_duty_cycle: 0.0
      enable_servos: true
      servo_i2c_bus: 7
      servo_i2c_address: 0x40
      servo_pwm_frequency: 50
      servo_pan_channel: 0
      servo_tilt_channel: 1
      servo_pan_inverted: false
      servo_tilt_inverted: false
      servo_min_angle_deg: 0.0
      servo_max_angle_deg: 180.0
      servo_min_pulse_us: 1000.0
      servo_max_pulse_us: 2000.0
      servo_startup_pan_deg: 90.0
      servo_startup_tilt_deg: 90.0
      servo_initialize_on_start: false
      servo_pan_topic: '/phat/camera_pan'
      servo_tilt_topic: '/phat/camera_tilt'
      # Servo safety parameters
      servo_max_speed_deg_per_sec: 30.0
      servo_max_accel_deg_per_sec2: 60.0
      servo_watchdog_timeout_sec: 1.0
      servo_soft_limit_margin_deg: 5.0
      servo_emergency_stop_enabled: true
      servo_safe_mode_enabled: true
      servo_init_speed_deg_per_sec: 10.0
      servo_init_delay_sec: 0.1
      wheelbase: 0.2
      max_speed: 1.0
      gpio_mode: 'BOARD'
      status_topic: '/phat/status'
      imu_topic: '/phat/imu'
      magnetometer_topic: '/phat/magnetometer'
      cmd_vel_topic: '/cmd_vel'
      imu_frame_id: 'phat_imu'
    topics:
      publish:
        - /phat/status
        - /phat/imu
        - /phat/magnetometer
      subscribe:
        - /cmd_vel
        - /phat/camera_pan
        - /phat/camera_tilt

  # Foxglove Bridge (for remote visualization)
  # Note: Bridge subscribes to all topics by default, which can cause connection drops
  # with high-frequency camera topics. Consider reducing camera frame rates if experiencing
  # disconnects, or use topic filtering via bridge command-line arguments.
  foxglove_bridge:
    enabled: true
    package: foxglove_bridge
    node: foxglove_bridge
    namespace: ""
    parameters:
      port: 8765
      address: "0.0.0.0"
      # Topic whitelist: ONLY bridged visualization topics (within 5 MB/s budget)
      # Feature topics (/sensor_fusion/*) are NOT bridged (consumed directly by VLA controller)
      # Raw topics (/hardware/*, /nvblox/full/*) are NOT bridged (use direct connection)
      topic_whitelist:
        - "/viz/remote/.*"  # All remote visualization topics (aggressively downsampled)
    topics:
      publish: []  # Bridge publishes/subscribes to all topics automatically
      subscribe: []

  # Communication with sub-modules (placeholder)
  submodules:
    raspberry_pi:
      enabled: false
      namespace: /submodules/rpi
      topics:
        publish:
          - /submodules/rpi/status
        subscribe:
          - /submodules/rpi/commands

# Topic remappings
remappings:
  # Example remappings for different robot configurations
  # - from: /camera/image
  #   to: /front_camera/image

# Node groups
groups:
  core:
    - system_monitor

  control:
    - vla_controller

  hardware:
    - realsense_camera
    - nvblox_processor
    - usb_microphone
    - irobot_serial
    - phat_motor_controller
    - hardware_sync_generator
    - sensor_fusion
  
  # Composable pipeline (zero-copy intra-process communication)
  composable_pipeline:
    - realsense_camera
    - nvblox_processor
    - sensor_fusion

  bench_test:
    - system_monitor
    - realsense_camera
    - nvblox_processor
    - usb_microphone
    - irobot_serial
    - phat_motor_controller

  all:
    - system_monitor
    - realsense_camera
    - nvblox_processor
    - usb_microphone
    - irobot_serial
    - phat_motor_controller
    - sensor_fusion
    - foxglove_bridge
