# Pre-commit hooks configuration
# Install with: pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
      - id: check-case-conflict

  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black", "--check-only", "--diff"]
        # Enforce imports at top of file
        # Groups: stdlib, third-party, local

  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']

  - repo: https://github.com/pre-commit/mirrors-pylint
    rev: v2.17.7
    hooks:
      - id: pylint
        args: ['--disable=C0111']  # Disable missing docstring warning

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v16.0.6
    hooks:
      - id: clang-format
        types: [c++, c]

  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ['-r', '.', '-ll']

  # Docker-based lint and unit tests for CI consistency
  - repo: local
    hooks:
      - id: docker-lint
        name: Docker Lint Tests
        entry: bash -c './scripts/testing/docker_test.sh lint'
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]
        verbose: true
      
      - id: docker-unit-tests
        name: Docker Unit Tests
        entry: bash -c './scripts/testing/docker_test.sh unit'
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]
        verbose: true
